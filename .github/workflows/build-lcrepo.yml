name: Build Living Culture Blazor

on:
  push:
    branches: [main]
    paths:
      - 'LCRepo/**'
      - '.github/workflows/build-lcrepo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: living-culture-blazor-build
  cancel-in-progress: false

jobs:
  compile-and-publish:
    name: Compile .NET 10 WebAssembly and commit static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Blazor WebAssembly
        run: dotnet publish LCRepo/LCRepo.csproj -c Release -o "$RUNNER_TEMP/lcrepo-publish"
      - name: Stage website under lc-blazor
        run: |
          set -euo pipefail
          rm -rf lc-blazor
          mkdir -p lc-blazor
          cp -a "$RUNNER_TEMP/lcrepo-publish/wwwroot/." lc-blazor/
          python3 - <<'PY'
          from pathlib import Path
          path = Path("lc-blazor/index.html")
          text = path.read_text()
          before = '<base href="/" />'
          after = '<base href="/Living-Culture_Website/lc-blazor/" />'
          if before not in text:
              raise SystemExit("Could not rewrite base href.")
          path.write_text(text.replace(before, after))
          PY
          touch .nojekyll
      - name: Commit published static files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lc-blazor .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish compiled Living Culture Blazor app [skip ci]"
            git push origin HEAD:main
          fi
