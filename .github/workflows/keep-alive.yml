# Free Supabase projects pause after about a week with no activity.
# This pings the database every 3 days so the site stays awake (free on GitHub Actions).
name: Keep database awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          URL="https://pzdszmlbjtcepevweefc.supabase.co"
          KEY="sb_publishable_RFyj9bTwV9iVg-GOWpgPRA_plWbmcbt"
          curl -fsS "$URL/rest/v1/notices?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /dev/null -w "HTTP %{http_code}\n"
