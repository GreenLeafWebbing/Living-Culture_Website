<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible – Living Culture</title>
  <meta name="description" content="Read the Bible online with Living Culture.">
  <link rel="icon" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.youversion.com/platform/1/bible.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/bible.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="brand">
        <img src="assets/logo.jpg" alt="" class="brand-logo">
        <span>Living Culture</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="index.html#notices">Notices</a>
        <a href="index.html#calendar">Calendar</a>
        <a href="index.html#requests">Requests</a>
        <a href="bible.html" aria-current="page">Bible</a>
      </nav>
    </div>
  </header>

  <main class="section bible-page">
    <div class="wrap narrow">
      <div class="section-head">
        <h2>Bible</h2>
        <p>“Your word is a lamp to my feet and a light to my path.” – Psalm 119:105</p>
      </div>

      <p id="bible-setup" class="card bible-msg" hidden></p>

      <!-- Verse of the Day -->
      <section id="votd" class="votd" hidden>
        <p class="votd-label">Verse of the Day</p>
        <blockquote id="votd-text"></blockquote>
        <p class="votd-ref"><span id="votd-ref"></span> <button type="button" class="link-btn" id="votd-open">Read chapter →</button></p>
      </section>

      <!-- Reader controls -->
      <div class="reader-bar card" id="reader-bar" hidden>
        <label class="field"><span>Version</span><select id="sel-version"></select></label>
        <label class="field"><span>Book</span><select id="sel-book"></select></label>
        <label class="field"><span>Chapter</span><select id="sel-chapter"></select></label>
      </div>

      <article class="reader card" id="reader" hidden>
        <h3 id="reader-ref" class="reader-ref"></h3>
        <div id="reader-text" data-yv-sdk data-slot="yv-bible-renderer"></div>
        <p id="reader-copy" class="reader-copy"></p>
        <div class="reader-nav">
          <button type="button" class="btn secondary" id="prev-ch">‹ Previous</button>
          <button type="button" class="btn secondary" id="next-ch">Next ›</button>
        </div>
      </article>

      <p class="powered">Scripture provided by the <a href="https://www.youversion.com" target="_blank" rel="noopener">YouVersion</a> Bible API.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>© <span id="year"></span> Living Culture · All glory to Jesus Christ, our Lord and Saviour.</p>
      <a href="admin.html" class="footer-admin">Leader login</a>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/bible.js"></script>
</body>
</html>
